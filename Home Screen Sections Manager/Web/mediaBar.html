<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Screen Manager — Abyss Media Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,300..700;1,17..18,300..700&display=swap" rel="stylesheet" />
    <script>
        (() => {
            const requested = new URLSearchParams(window.location.search).get('abyssCss') || '';
            let cssUrl = '';
            try {
                const parsed = new URL(requested, window.location.origin);
                if (parsed.origin === window.location.origin) cssUrl = parsed.href;
            } catch (_) { /* Use the installed-theme fallback below. */ }
            if (!cssUrl) cssUrl = new URL('ui/spotlight.css', window.top.document.baseURI).href;
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = cssUrl;
            document.head.appendChild(link);
        })();
    </script>
    <style>
        #backdrop {
            -webkit-mask-image:
                linear-gradient(to bottom, #000 30%, rgba(0,0,0,.96) 50%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.32) 88%, transparent 100%),
                linear-gradient(to right, transparent 0%, #000 25%, #000 70%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, #000 8%);
            mask-image:
                linear-gradient(to bottom, #000 30%, rgba(0,0,0,.96) 50%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.32) 88%, transparent 100%),
                linear-gradient(to right, transparent 0%, #000 25%, #000 70%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, #000 8%);
        }
        #reflection {
            bottom:-5%;
            height:27%;
            left:8%;
            opacity:0;
            overflow:hidden;
            pointer-events:none;
            position:absolute;
            right:8%;
            transition:opacity 1.1s var(--ease);
            z-index:1;
            -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,.34), rgba(0,0,0,.12) 48%, transparent 100%);
            mask-image:linear-gradient(to bottom, rgba(0,0,0,.34), rgba(0,0,0,.12) 48%, transparent 100%);
        }
        #reflection.loaded { opacity:.17; }
        #reflection img {
            filter:blur(16px) saturate(1.12);
            height:145%;
            object-fit:cover;
            transform:scaleY(-1) scale(1.04);
            transform-origin:center top;
            width:100%;
        }
        #reflection::after {
            background:linear-gradient(105deg, transparent 20%, rgba(255,255,255,.08) 48%, transparent 72%);
            content:'';
            inset:0;
            position:absolute;
        }
    </style>
</head>
<body>
    <!--
      Uses the visual structure and installed stylesheet of Abyss Spotlight 1.2.2 at source revision 0dc066d604bdbf7977c014f275ae6f2967ec4fe2.
      Original work copyright (c) 2026 Om Gupta, licensed under the MIT License.
      Home Screen Manager adaptation copyright (c) 2026 mp3li.
      The retained license is served at ./abyss-license.txt and included with the plugin source/package.
      Upstream: https://github.com/AumGupta/abyss-jellyfin
    -->
    <div id="backdrop"><img id="backdrop-img" alt="" /></div>
    <div id="reflection" aria-hidden="true"><img id="reflection-img" alt="" /></div>
    <div id="content">
        <img id="logo" alt="" />
        <div id="title"></div>
        <div id="episode-label"></div>
        <div id="meta"></div>
        <div id="progress-wrap" style="display:none"><div id="progress-bar"></div></div>
        <div id="plot"></div>
        <div id="buttons"></div>
    </div>
    <div id="carousel-dots"></div>
    <button id="clickzone" type="button" aria-label="View item details"></button>
    <div id="empty" style="display:none">Nothing to show</div>

    <script>
        (() => {
            'use strict';

            const $ = id => document.getElementById(id);
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
            const serverIntervalSeconds = Number('__HSSM_MEDIA_BAR_INTERVAL__');
            const serverImageType = '__HSSM_MEDIA_BAR_IMAGE_TYPE__';
            let items = [];
            let currentIndex = 0;
            const initialParameters = new URLSearchParams(window.location.search);
            let intervalMilliseconds = Math.max(1000, Math.min(300000, (Number.isFinite(serverIntervalSeconds) ? serverIntervalSeconds : Number(initialParameters.get('intervalSeconds') || 5)) * 1000));
            let imageType = ['backdrop', 'primary', 'banner', 'thumb'].includes(serverImageType) ? serverImageType : (['backdrop', 'primary', 'banner', 'thumb'].includes(initialParameters.get('imageType')) ? initialParameters.get('imageType') : 'backdrop');
            let autoTimer = null;
            let preloadTimer = null;
            let renderController = null;
            let preloadImage = null;
            let zoomAnimation = null;
            let renderSequence = 0;
            let paused = true;
            let disposed = false;

            const SVG_PLAY = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M320-273v-414q0-17 12-28.5t28-11.5q5 0 10.5 1.5T381-721l326 207q9 6 13.5 15t4.5 19q0 10-4.5 19T707-446L381-239q-5 3-10.5 4.5T360-233q-16 0-28-11.5T320-273Z"/></svg>';
            const SVG_INFO = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M423.5-703.5Q400-727 400-760t23.5-56.5Q447-840 480-840t56.5 23.5Q560-793 560-760t-23.5 56.5Q513-680 480-680t-56.5-23.5Zm14 566Q420-155 420-180v-360q0-25 17.5-42.5T480-600q25 0 42.5 17.5T540-540v360q0 25-17.5 42.5T480-120q-25 0-42.5-17.5Z"/></svg>';
            const SVG_RATING = '<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M168-144q-29 0-50.5-21.5T96-216v-528q0-29.7 21.5-50.85Q139-816 168-816h624q29 0 50.5 21.15T864-744v528q0 29-21.5 50.5T792-144H168Zm337.5-154.35Q516-308.7 516-324v-168q0-15.3-10.29-25.65Q495.42-528 480.21-528t-25.71 10.35Q444-507.3 444-492v168q0 15.3 10.29 25.65Q464.58-288 479.79-288t25.71-10.35ZM480-600q14 0 25-11t11-25.5q0-14.5-11-25T479.5-672q-14.5 0-25 10.35T444-636q0 14 10.35 25T480-600ZM168-228h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-372h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-516h72v-72h-72v72Zm552 0h72v-72h-72v72ZM168-660h72v-72h-72v72Zm552 0h72v-72h-72v72Z"/></svg>';
            const SVG_CLOCK = '<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="M516-510v-174q0-15.3-10.29-25.65Q495.42-720 480.21-720t-25.71 10.35Q444-699.3 444-684v189q0 8 3 14.5t8 11.5l133.85 133.85Q600-324 614.5-324.5 629-325 640-336t11-25.5q0-14.5-11.34-25.75L516-510ZM480-96q-79.38 0-149.19-30T208.5-208.5Q156-261 126-330.96t-30-149.5Q96-560 126-630q30-70 82.5-122t122.46-82q69.96-30 149.5-30t149.55 30.24q70 30.24 121.79 82.08 51.78 51.84 81.99 121.92Q864-559.68 864-480q0 79.38-30 149.19T752-208.5Q700-156 629.87-126T480-96Z"/></svg>';
            const SVG_STAR = '<svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor"><path d="m480-285-164 98q-11 6-21.5 5t-18.5-7q-8-6-12-16.5t-1-21.5l43-183-145-123q-9-8-11-18.5t1-20.5q3-10 11-16.5t20-7.5l190-17 75-174q5-11 14-16.5t19-5.5q10 0 19 5.5t14 16.5l75 175 190 16q12 1 20 8t11 17q3 10 .5 20T798-533L654-410l43 183q3 11-1 21.5T684-189q-8 6-18.5 7t-21.5-5l-164-98Z"/></svg>';

            function normalizeAddress(value) {
                if (!value) return '';
                try {
                    const url = new URL(value, window.location.origin);
                    return `${url.origin}${url.pathname.replace(/\/+$/, '')}`;
                } catch (_) { return ''; }
            }

            function getBaseUrl() {
                try {
                    const loc = window.top.location;
                    const match = loc.pathname.match(/^(.*?)\/web\b/);
                    return normalizeAddress(`${loc.protocol}//${loc.host}${match ? match[1] : ''}`);
                } catch (_) {
                    try {
                        const credentials = JSON.parse(localStorage.getItem('jellyfin_credentials'));
                        const server = credentials && credentials.Servers && credentials.Servers.find(entry => entry.AccessToken && entry.UserId);
                        return normalizeAddress(server && (server.ManualAddress || server.LocalAddress || server.RemoteAddress));
                    } catch (_) { return ''; }
                }
            }

            const base = getBaseUrl();

            function formatRuntime(ticks) {
                if (!ticks) return null;
                const minutes = Math.floor(ticks / 600000000);
                if (minutes < 60) return `${minutes}m`;
                const hours = Math.floor(minutes / 60);
                const remainder = minutes % 60;
                return remainder ? `${hours}h ${remainder}m` : `${hours}h`;
            }

            function metaPill(icon, text) {
                const pill = document.createElement('span');
                const label = document.createElement('span');
                pill.className = 'meta-pill';
                pill.innerHTML = icon;
                label.textContent = String(text);
                pill.appendChild(label);
                return pill;
            }

            function navigateTo(route) {
                try { window.top.location.hash = route; }
                catch (_) { window.location.hash = route; }
            }

            function imageDimensions(type) {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                if (type === 'Logo') return { width: Math.min(960, Math.ceil(window.innerWidth * 0.55 * dpr)), height: Math.min(360, Math.ceil(120 * dpr)) };
                return { width: Math.min(2560, Math.ceil(window.innerWidth * dpr)), height: Math.min(1440, Math.ceil(window.innerHeight * dpr)) };
            }

            function imageUrl(itemId, type, index, tag) {
                if (!itemId || !base) return '';
                const dimensions = imageDimensions(type);
                const suffix = index === undefined || index === null ? '' : `/${index}`;
                const path = `Items/${encodeURIComponent(itemId)}/Images/${type}${suffix}`;
                const parameters = { type, quality: 96, maxWidth: dimensions.width, maxHeight: dimensions.height };
                if (index !== undefined && index !== null) parameters.index = index;
                if (tag) parameters.tag = tag;
                try {
                    if (window.top.ApiClient && typeof window.top.ApiClient.getScaledImageUrl === 'function') return window.top.ApiClient.getScaledImageUrl(itemId, parameters);
                    if (window.top.ApiClient && typeof window.top.ApiClient.getImageUrl === 'function') return window.top.ApiClient.getImageUrl(itemId, parameters);
                    if (window.top.ApiClient && typeof window.top.ApiClient.getUrl === 'function') return window.top.ApiClient.getUrl(path, parameters);
                } catch (_) { /* Fall back to the same-origin server address below. */ }
                return `${base}/${path}?quality=96&maxWidth=${dimensions.width}&maxHeight=${dimensions.height}${tag ? `&tag=${encodeURIComponent(tag)}` : ''}`;
            }

            function firstCandidate(candidates) {
                return candidates.length ? { image: candidates[0].url, centered: candidates[0].centered } : { image: null, centered: false };
            }

            function uniqueCandidates(candidates) {
                const seen = new Set();
                return candidates.filter(candidate => candidate && candidate.url && !seen.has(candidate.url) && seen.add(candidate.url));
            }

            function candidate(itemId, type, index, tag, centered) {
                return itemId && tag ? { url: imageUrl(itemId, type, index, tag), centered } : null;
            }

            function backgroundCandidates(item) {
                const tags = item.ImageTags || {};
                const itemId = item.Id;
                const seriesId = item.SeriesId || '';
                const backdropTags = item.BackdropImageTags || [];
                const parentBackdropTags = item.ParentBackdropImageTags || [];
                const primary = [
                    candidate(itemId, 'Primary', null, tags.Primary, true),
                    candidate(seriesId, 'Primary', null, item.SeriesPrimaryImageTag, true),
                    candidate(item.PrimaryImageItemId || itemId, 'Primary', null, item.PrimaryImageTag, true),
                    candidate(item.ParentPrimaryImageItemId, 'Primary', null, item.ParentPrimaryImageTag, true)
                ];
                const backdrop = [
                    candidate(itemId, 'Backdrop', 0, backdropTags[0], false),
                    candidate(item.ParentBackdropItemId || seriesId, 'Backdrop', 0, parentBackdropTags[0], false)
                ];
                const thumb = [
                    candidate(itemId, 'Thumb', null, tags.Thumb, true),
                    candidate(seriesId, 'Thumb', null, item.SeriesThumbImageTag, true),
                    candidate(item.ParentThumbItemId, 'Thumb', null, item.ParentThumbImageTag, true)
                ];
                const banner = [candidate(itemId, 'Banner', null, tags.Banner, true)];
                const preferred = imageType === 'primary' ? primary : imageType === 'banner' ? banner : imageType === 'thumb' ? thumb : backdrop;
                return uniqueCandidates(preferred.concat(backdrop, primary, thumb, banner));
            }

            function logoCandidate(item) {
                const tags = item.ImageTags || {};
                if (tags.Logo) return imageUrl(item.Id, 'Logo', null, tags.Logo);
                if (item.ParentLogoImageTag && item.ParentLogoItemId) return imageUrl(item.ParentLogoItemId, 'Logo', null, item.ParentLogoImageTag);
                return '';
            }

            function fetchArtwork(item, signal) {
                if (signal.aborted) return Promise.reject(new DOMException('Aborted', 'AbortError'));
                const candidates = backgroundCandidates(item);
                const background = firstCandidate(candidates);
                return Promise.resolve({ backdrop: background.image, logo: logoCandidate(item), centered: background.centered, candidates });
            }

            function startZoom(image) {
                if (zoomAnimation) zoomAnimation.cancel();
                zoomAnimation = null;
                image.style.transform = 'scale(1) translate(0, 0)';
                if (paused || reducedMotion.matches) return;
                const angle = Math.random() * Math.PI * 2;
                zoomAnimation = image.animate([
                    { transform: 'scale(1) translate(0, 0)' },
                    { transform: `scale(1.08) translate(${Math.cos(angle) * 1.5}%, ${Math.sin(angle) * 1.5}%)` }
                ], { duration: 9000, easing: 'linear', fill: 'forwards' });
            }

            function stopAuto() {
                if (autoTimer) clearTimeout(autoTimer);
                autoTimer = null;
            }

            function startAuto() {
                stopAuto();
                if (paused || disposed || items.length <= 1 || reducedMotion.matches) return;
                autoTimer = setTimeout(async () => {
                    currentIndex = (currentIndex + 1) % items.length;
                    await renderItem(currentIndex);
                    startAuto();
                }, intervalMilliseconds);
            }

            function updateDots() {
                Array.from($('carousel-dots').querySelectorAll('.dot')).forEach((dot, index) => {
                    const distance = Math.abs(index - currentIndex);
                    dot.className = 'dot ' + (distance === 0 ? 'dot-active' : distance === 1 ? 'dot-near' : distance === 2 ? 'dot-far' : 'dot-hidden');
                    dot.setAttribute('aria-current', distance === 0 ? 'true' : 'false');
                });
            }

            async function selectItem(index) {
                if (disposed || items.length < 2) return;
                // A visible, directly-interacted-with spotlight must remain operable even
                // if an upstream lifecycle message arrived just before the pointer event.
                if (paused && !document.hidden) paused = false;
                if (paused) return;
                stopAuto();
                currentIndex = (index + items.length) % items.length;
                await renderItem(currentIndex);
                startAuto();
            }

            function buildDots() {
                const container = $('carousel-dots');
                container.replaceChildren();
                container.style.display = items.length > 1 ? 'flex' : 'none';
                items.forEach((_, index) => {
                    const dot = document.createElement('button');
                    dot.type = 'button';
                    dot.className = 'dot';
                    dot.setAttribute('aria-label', `Show item ${index + 1}`);
                    dot.addEventListener('pointerdown', event => event.stopPropagation());
                    dot.addEventListener('click', event => {
                        event.preventDefault();
                        event.stopPropagation();
                        selectItem(index);
                    });
                    container.appendChild(dot);
                });
                updateDots();
            }

            function queuePreload() {
                if (preloadTimer) clearTimeout(preloadTimer);
                if (paused || items.length <= 1) return;
                const next = items[(currentIndex + 1) % items.length];
                const candidate = backgroundCandidates(next)[0];
                preloadTimer = setTimeout(() => {
                    if (!candidate) return;
                    preloadImage = new Image();
                    preloadImage.src = candidate.url;
                }, 250);
            }

            function setButtonContent(button, icon, label) {
                button.innerHTML = icon;
                if (label) {
                    const text = document.createElement('span');
                    text.textContent = label;
                    button.appendChild(text);
                }
            }

            async function triggerPlayback(item) {
                const startPositionTicks = Number(item.UserData && item.UserData.PlaybackPositionTicks || item.PlaybackPositionTicks || 0);
                let serverId = String(item.ServerId || '');
                try {
                    if (!serverId && window.top.ApiClient && typeof window.top.ApiClient.serverId === 'function') serverId = String(window.top.ApiClient.serverId() || '');
                } catch (_) { /* Playback still works on the active server without an explicit ID. */ }
                try {
                    if (window.top.PlaybackManager && typeof window.top.PlaybackManager.play === 'function') {
                        await window.top.PlaybackManager.play({ items: [item], startPositionTicks, serverId });
                        return;
                    }
                    if (window.top.ApiClient && typeof window.top.ApiClient.play === 'function') {
                        await window.top.ApiClient.play({ ids: [String(item.Id)], startPositionTicks, serverId });
                        return;
                    }
                } catch (error) {
                    console.warn('[Home Screen Manager media bar] Jellyfin playback could not start.', error);
                }
                navigateTo(`/details?id=${item.SeriesId || item.Id}`);
            }

            function updateContent(item, artwork, sequence) {
                const isEpisode = item.Type === 'Episode';
                const detailId = isEpisode ? item.SeriesId || item.Id : item.Id;
                const detailRoute = `/details?id=${detailId}`;
                const title = isEpisode ? item.SeriesName || item.Name : item.Name;
                const backdropImage = $('backdrop-img');
                const reflectionImage = $('reflection-img');

                if (artwork.backdrop) {
                    const candidates = artwork.candidates || [{ url: artwork.backdrop, centered: artwork.centered }];
                    let candidateIndex = 0;
                    const applyCandidate = () => {
                        const candidate = candidates[candidateIndex];
                        if (!candidate) {
                            backdropImage.onerror = null;
                            backdropImage.removeAttribute('src');
                            return;
                        }
                        backdropImage.style.objectPosition = candidate.centered ? 'center center' : 'center 20%';
                        backdropImage.src = candidate.url;
                        reflectionImage.style.objectPosition = backdropImage.style.objectPosition;
                        reflectionImage.src = candidate.url;
                    };
                    backdropImage.onerror = () => { if (sequence !== renderSequence) return; candidateIndex += 1; applyCandidate(); };
                    applyCandidate();
                    $('backdrop').classList.add('loaded');
                    $('reflection').classList.add('loaded');
                    startZoom(backdropImage);
                } else {
                    backdropImage.onerror = null;
                    if (zoomAnimation) zoomAnimation.cancel();
                    zoomAnimation = null;
                    backdropImage.removeAttribute('src');
                    reflectionImage.removeAttribute('src');
                    backdropImage.style.transform = '';
                    $('backdrop').classList.add('loaded');
                    $('reflection').classList.remove('loaded');
                }

                const logo = $('logo');
                logo.onload = null;
                logo.onerror = null;
                logo.removeAttribute('src');
                logo.style.display = 'none';
                $('title').style.display = 'block';
                $('title').textContent = title || '';
                if (artwork.logo) {
                    logo.onload = () => {
                        if (sequence !== renderSequence) return;
                        logo.style.display = 'block';
                        $('title').style.display = 'none';
                    };
                    logo.onerror = () => {
                        if (sequence !== renderSequence) return;
                        logo.removeAttribute('src');
                        logo.style.display = 'none';
                        $('title').style.display = 'block';
                    };
                    logo.src = artwork.logo;
                }

                let episodePrefix = '';
                if (isEpisode) {
                    const parts = [];
                    if (item.ParentIndexNumber != null && item.IndexNumber != null) {
                        episodePrefix = `S${item.ParentIndexNumber} E${item.IndexNumber}`;
                        parts.push(episodePrefix);
                    }
                    if (item.Name) parts.push(item.Name);
                    $('episode-label').textContent = parts.join('  \u2013  ');
                    $('episode-label').style.display = 'block';
                } else {
                    $('episode-label').textContent = '';
                    $('episode-label').style.display = 'none';
                }

                const played = Number(item.UserData && item.UserData.PlayedPercentage || item.PlaybackPositionTicks ? 1 : 0);
                const isResume = item._source === 'resume' || played > 0;
                const playLabel = isResume ? (isEpisode ? `Continue ${episodePrefix}` : 'Resume') : (isEpisode ? `Play ${episodePrefix}`.trim() : 'Play');
                const playButton = document.createElement('button');
                playButton.type = 'button';
                playButton.className = 'btn btn-play';
                setButtonContent(playButton, SVG_PLAY, playLabel);
                playButton.addEventListener('click', () => triggerPlayback(item));
                const infoButton = document.createElement('button');
                infoButton.type = 'button';
                infoButton.className = 'btn btn-info';
                infoButton.setAttribute('aria-label', 'More information');
                setButtonContent(infoButton, SVG_INFO, '');
                infoButton.addEventListener('click', event => { event.preventDefault(); navigateTo(detailRoute); });
                $('buttons').replaceChildren(playButton, infoButton);

                const meta = $('meta');
                meta.replaceChildren();
                if (item.OfficialRating) meta.appendChild(metaPill(SVG_RATING, item.OfficialRating));
                const runtime = formatRuntime(item.RunTimeTicks);
                if (runtime) meta.appendChild(metaPill(SVG_CLOCK, runtime));
                const rating = Number(item.CommunityRating);
                if (Number.isFinite(rating) && rating > 0) meta.appendChild(metaPill(SVG_STAR, rating.toFixed(1)));
                const playedPercentage = Number(item.UserData && item.UserData.PlayedPercentage);
                $('progress-wrap').style.display = playedPercentage > 0 ? 'block' : 'none';
                $('progress-bar').style.width = `${Math.min(Math.max(playedPercentage || 0, 0), 100)}%`;
                $('plot').textContent = item.Overview || '';
                $('clickzone').setAttribute('aria-label', `View details for ${title || 'item'}`);
                $('clickzone').onclick = () => navigateTo(detailRoute);
            }

            function notifyRendered() {
                window.parent.postMessage({ type: 'home-screen-manager-media-bar', action: 'rendered' }, window.location.origin);
            }

            async function renderItem(index) {
                const item = items[index];
                if (!item || paused || disposed) return false;
                if (renderController) renderController.abort();
                renderController = new AbortController();
                const signal = renderController.signal;
                const sequence = ++renderSequence;
                updateDots();
                $('content').classList.remove('visible');
                $('backdrop').classList.remove('loaded');
                $('reflection').classList.remove('loaded');
                try {
                    const artwork = await fetchArtwork(item, signal);
                    if (signal.aborted || sequence !== renderSequence) return false;
                    updateContent(item, artwork, sequence);
                    $('content').classList.add('visible');
                    notifyRendered();
                    queuePreload();
                    return true;
                } catch (error) {
                    if (error.name !== 'AbortError') console.error('[Home Screen Manager media bar] Render failed.', error);
                    return false;
                }
            }

            async function configure(data) {
                const currentId = items[currentIndex] && items[currentIndex].Id;
                const nextItems = Array.isArray(data.items) ? data.items.filter(item => item && item.Id) : [];
                const authoritativeInterval = Number.isFinite(serverIntervalSeconds) ? serverIntervalSeconds : data.intervalSeconds;
                const authoritativeImageType = ['backdrop', 'primary', 'banner', 'thumb'].includes(serverImageType) ? serverImageType : data.imageType;
                const nextSignature = JSON.stringify([authoritativeInterval, authoritativeImageType, nextItems.map(item => String(item.Id))]);
                if (document.body.dataset.hssmPayloadSignature === nextSignature) return;
                document.body.dataset.hssmPayloadSignature = nextSignature;
                const nextImageType = ['backdrop', 'primary', 'banner', 'thumb'].indexOf(String(authoritativeImageType)) >= 0 ? String(authoritativeImageType) : 'backdrop';
                if (renderController) renderController.abort();
                if (preloadTimer) clearTimeout(preloadTimer);
                preloadTimer = null;
                renderSequence += 1;
                intervalMilliseconds = Math.max(1000, Math.min(300000, Number(authoritativeInterval || 5) * 1000));
                imageType = nextImageType;
                items = nextItems;
                currentIndex = Math.max(0, items.findIndex(item => String(item.Id) === String(currentId || '')));
                $('empty').style.display = items.length ? 'none' : 'flex';
                buildDots();
                stopAuto();
                if (!items.length) notifyRendered();
                else if (!paused) await renderItem(currentIndex);
                startAuto();
            }

            function pause() {
                if (paused || disposed) return;
                paused = true;
                stopAuto();
                if (preloadTimer) clearTimeout(preloadTimer);
                if (renderController) renderController.abort();
                preloadImage = null;
                if (zoomAnimation) zoomAnimation.cancel();
                zoomAnimation = null;
            }

            async function resume() {
                if (disposed) return;
                const wasPaused = paused;
                paused = false;
                if (wasPaused && items.length) await renderItem(currentIndex);
                startAuto();
            }

            function dispose() {
                if (disposed) return;
                disposed = true;
                paused = true;
                stopAuto();
                if (preloadTimer) clearTimeout(preloadTimer);
                if (renderController) renderController.abort();
                preloadImage = null;
                if (zoomAnimation) zoomAnimation.cancel();
            }

            let touchStartX = 0;
            let touchStartY = 0;
            let touchInteractive = false;
            document.addEventListener('touchstart', event => {
                const touch = event.changedTouches[0];
                touchStartX = touch.screenX;
                touchStartY = touch.screenY;
                touchInteractive = Boolean(event.target.closest('button, a, input, select, textarea'));
            }, { passive: true });
            document.addEventListener('touchend', event => {
                if (touchInteractive || paused || items.length < 2) return;
                const touch = event.changedTouches[0];
                const deltaX = touch.screenX - touchStartX;
                const deltaY = touch.screenY - touchStartY;
                if (Math.abs(deltaX) < 50 || Math.abs(deltaX) <= Math.abs(deltaY)) return;
                selectItem(currentIndex + (deltaX < 0 ? 1 : -1));
            }, { passive: true });

            window.addEventListener('message', event => {
                if (event.source !== window.parent || event.origin !== window.location.origin || !event.data) return;
                if (event.data.type === 'home-screen-manager-media-bar' && event.data.action === 'configure') configure(event.data);
                if (event.data.type === 'abyss-spotlight' && event.data.action === 'pause') pause();
                if (event.data.type === 'abyss-spotlight' && event.data.action === 'resume') resume();
            });
            document.addEventListener('visibilitychange', () => { document.hidden ? pause() : resume(); });
            window.addEventListener('pagehide', dispose, { once: true });
            reducedMotion.addEventListener && reducedMotion.addEventListener('change', () => {
                if (reducedMotion.matches) {
                    if (zoomAnimation) zoomAnimation.cancel();
                    zoomAnimation = null;
                    stopAuto();
                } else if (!paused) {
                    startZoom($('backdrop-img'));
                    startAuto();
                }
            });

            window.parent.postMessage({ type: 'home-screen-manager-media-bar', action: 'ready' }, window.location.origin);
            if (!document.hidden) resume();
        })();
    </script>
</body>
</html>
